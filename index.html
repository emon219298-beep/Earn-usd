<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ভিডিও গ্যালারি | ল্যান্ডিং পেজ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fc;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-weight: 600;
            font-size: 2.4rem;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .sub-head {
            text-align: center;
            color: #475569;
            margin-bottom: 40px;
            font-size: 1.1rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 30px;
            justify-content: center;
        }

        .video-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .video-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 75%;
            background: #0b1120;
            overflow: hidden;
            cursor: pointer;
        }

        .thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
            display: block;
        }

        .video-card:hover .thumbnail-wrapper img {
            transform: scale(1.03);
        }

        .video-play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(3px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 32px;
            border: 3px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
            pointer-events: none;
            z-index: 2;
        }

        .video-play-icon i {
            margin-left: 5px;
        }

        .video-card:hover .video-play-icon {
            background: rgba(220, 38, 38, 0.8);
            transform: translate(-50%, -50%) scale(1.08);
            border-color: #ffffff;
        }

        .card-body {
            padding: 18px 18px 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #ffffff;
            flex: 1;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-title i {
            color: #ef4444;
            font-size: 0.8rem;
        }

        .watch-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #1e293b;
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.15s ease;
            width: 100%;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
        }

        .watch-btn i {
            font-size: 1.1rem;
        }

        .watch-btn:hover {
            background: #dc2626;
            transform: scale(1.02);
            box-shadow: 0 8px 18px rgba(220, 38, 38, 0.25);
        }

        .watch-btn:active {
            transform: scale(0.96);
        }

        .footer-note {
            margin-top: 50px;
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid #e2e8f0;
            padding-top: 25px;
        }

        @media (max-width: 600px) {
            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 20px;
            }
            .video-play-icon {
                width: 56px;
                height: 56px;
                font-size: 26px;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 ভিডিও গ্যালারি</h1>
        <p class="sub-head">ভিডিও দেখার জন্য নিচের যেকোনো বিডিও তে বা বাটনে ক্লিক করুন</p>

        <div class="gallery-grid" id="galleryGrid"></div>

        <div class="footer-note">
            <i class="fas fa-play-circle" style="color: #dc2626;"></i> প্রতিটি ছবির উপর কাস্টম ভিডিও আইকন • ক্লিক করলেই ভিডিও লিংক
        </div>
    </div>

    <script>
        (function() {
            // ----- ২৬টি ছবির লিংক -----
            const imageUrls = [
                "https://i.ibb.co.com/wFyN7mGC/1786465217212.jpg",
                "https://i.ibb.co.com/wZcy1msY/1786463940201.jpg",
                "https://i.ibb.co.com/R187YSG/IMG-20260811-210538-083.jpg",
                "https://i.ibb.co.com/b5Wn9DG2/IMG-20260811-210501-837.jpg",
                "https://i.ibb.co.com/gZgjYt4F/IMG-20260811-210453-982.jpg",
                "https://i.ibb.co.com/sdmHFhKF/IMG-20260811-210115-424.jpg",
                "https://i.ibb.co.com/r2pnQ1cz/IMG-20260811-210053-819.jpg",
                "https://i.ibb.co.com/HDZYkg5L/IMG-20260811-210044-815.jpg",
                "https://i.ibb.co.com/Mxfys4VS/IMG-20260811-210044-764.jpg",
                "https://i.ibb.co.com/6721pM2R/IMG-20260811-210045-006.jpg",
                "https://i.ibb.co.com/67CH80kF/IMG-20260811-210044-571.jpg",
                "https://i.ibb.co.com/C5MqpDt9/IMG-20260811-210044-339.jpg",
                "https://i.ibb.co.com/FkCmPTZh/IMG-20260811-210044-318.jpg",
                "https://i.ibb.co.com/DDJ3bNXS/IMG-20260811-210039-235.jpg",
                "https://i.ibb.co.com/ds2Y7Vvm/IMG-20260811-210039-426.jpg",
                "https://i.ibb.co.com/s9b3vJB0/IMG-20260811-210039-428.jpg",
                "https://i.ibb.co.com/Y7Wb1vKj/IMG-20260811-210039-394.jpg",
                "https://i.ibb.co.com/3m6YW9kj/IMG-20260811-210034-192.jpg",
                "https://i.ibb.co.com/p6m3k704/IMG-20260811-210033-680.jpg",
                "https://i.ibb.co.com/R4NSQtkr/IMG-20260811-210033-435.jpg",
                "https://i.ibb.co.com/yc8hLjvX/IMG-20260811-210034-052.jpg",
                "https://i.ibb.co.com/pvf62Y5p/IMG-20260811-210033-775.jpg",
                "https://i.ibb.co.com/KxHSPrmY/IMG-20260811-210034-244.jpg",
                "https://i.ibb.co.com/vCgk8WXy/IMG-20260811-210028-593.jpg",
                "https://i.ibb.co.com/vxWvyMLp/IMG-20260811-210024-067.jpg",
                "https://i.ibb.co.com/Q7wP5vTn/IMG-20260811-210028-852.jpg"
            ];

            // ----- আপনার দেওয়া ১১টি লিংক -----
            const allLinks = [
                "https://t.co/bHbTaFogPl",
                "https://t.co/VNUrpU5YV5",
                "https://omg10.com/4/9446627",
                "https://omg10.com/4/9429975",
                "https://omg10.com/4/9717825",
                "https://t.me/neonrushearnbot?startapp",
                "https://t.me/iIobRcYvU2MGU9V1bot?startapp",
                "https://t.me/arning_hubbot?startapp",
                "https://tinyurl.com/4pucmmjm",
                "https://tinyurl.com/mt62b4ap",
                "https://t.me/neonrushearnbot?startapp"
            ];

            // ফাংশন: প্রতিটি ছবির জন্য লিংক নির্ধারণ (রাউন্ড-রবিন)
            function getLinkForIndex(index) {
                return allLinks[index % allLinks.length];
            }

            const galleryGrid = document.getElementById('galleryGrid');

            // প্রতিটি ছবির জন্য কার্ড তৈরি
            imageUrls.forEach((imgUrl, index) => {
                const card = document.createElement('div');
                card.className = 'video-card';

                const targetLink = getLinkForIndex(index);

                // ---- থাম্বনেইল + ওভারলে ----
                const wrapper = document.createElement('div');
                wrapper.className = 'thumbnail-wrapper';

                const img = document.createElement('img');
                img.src = imgUrl;
                img.alt = `ভিডিও থাম্বনেইল ${index+1}`;
                img.loading = 'lazy';

                // কাস্টম ভিডিও আইকন
                const iconDiv = document.createElement('div');
                iconDiv.className = 'video-play-icon';
                iconDiv.innerHTML = `<i class="fas fa-play"></i>`;

                // ছবির উপর ক্লিক করলে লিংকে যাবে
                wrapper.style.cursor = 'pointer';
                wrapper.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.open(targetLink, '_blank');
                });

                wrapper.appendChild(img);
                wrapper.appendChild(iconDiv);

                // ---- কার্ডের বডি ----
                const body = document.createElement('div');
                body.className = 'card-body';

                const title = document.createElement('div');
                title.className = 'card-title';
                title.innerHTML = `<i class="fas fa-video" style="color:#dc2626;"></i> ভিডিও #${index+1}`;

                // 'ভিডিও দেখুন' বাটন
                const watchBtn = document.createElement('button');
                watchBtn.className = 'watch-btn';
                watchBtn.innerHTML = `<i class="fas fa-play-circle"></i> ভিডিও দেখুন`;
                watchBtn.setAttribute('type', 'button');
                watchBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    window.open(targetLink, '_blank');
                });

                body.appendChild(title);
                body.appendChild(watchBtn);

                card.appendChild(wrapper);
                card.appendChild(body);

                galleryGrid.appendChild(card);
            });

            console.log(`✅ ${imageUrls.length} টি কার্ড তৈরি হয়েছে।`);
            console.log(`📌 ${allLinks.length} টি লিংক রাউন্ড-রবিন পদ্ধতিতে বসানো হয়েছে।`);
            console.log('👉 ছবি বা বাটনে ক্লিক করলে JavaScript window.open() দিয়ে লিংক ওপেন হবে।');
        })();
    </script>
</body>
</html>
